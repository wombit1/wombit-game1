<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$WOMBIT Wombat Oyunu 🦥</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            margin: 0; padding: 0;
            background: linear-gradient(to bottom, #4b0082, #8a2be2, #ff69b4); 
            color: white; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            overflow: hidden;
        }
        img { 
            width: 280px; 
            cursor: pointer;
            transition: all 0.3s;
        }
        img:active { 
            transform: scale(1.25) rotate(10deg) translateY(-30px); 
        }
        h1 { font-size: 28px; margin: 10px 0; text-shadow: 0 0 15px gold; }
        button {
            margin: 15px 10px;
            padding: 16px 36px;
            font-size: 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        .tap-btn { background: #ffd700; color: #4b0082; }
        .buy-btn { background: #00ff9d; color: #000; }
        .score { font-size: 26px; margin: 15px; font-weight: bold; text-shadow: 0 0 10px white; }
        .social-icons img {
            width: 50px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .social-icons img:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <h1>🦥 $WOMBIT Wombat</h1>

    <img id="wombat" src="images/wombat.png" onclick="tapWombat()">

    <p>Wombat'a dokun, puan topla ve moon'a yardım et! ✨</p>

    <button class="tap-btn" onclick="tapWombat()">🦥 Wombat'a Dokun!</button>

    <button class="buy-btn" onclick="buyWOMBIT()">💰 $WOMBIT Satın Al</button>

    <p class="score" id="score">Puanın: 0</p>

    <h2>💬 Bizi Takip Et</h2>

    <div class="social-icons" style="display:flex; gap:15px;">
        <a href="https://x.com/wombat_io" target="_blank">
            <img src="images/twitter_icon.png">
        </a>
        <a href="https://t.me/wombit_io_io" target="_blank">
            <img src="images/telegram_chat_icon.png">
        </a>
        <a href="https://t.me/wombit_io" target="_blank">
            <img src="images/telegram_channel_icon.png">
        </a>
        <a href="https://www.tiktok.com/@wombat_io" target="_blank">
            <img src="images/tiktok_icon.png">
        </a>
    </div>

    <script>
        let score = 0;
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function tapWombat() {
            score += 15;
            document.getElementById('score').textContent = 'Puanın: ' + score;
        }

        function buyWOMBIT() {
            window.open("https://bags.fm/3fzFmWRedsjuybCgic1rkkZAdKhzeHVvxs7sGBgrBAGS", "_blank");
        }
    </script>

</body>
</html>
